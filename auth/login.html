<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axe Intelligence — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      /* ── Dark theme ── */
      --bg-base: #0c0e13;
      --bg-card: #14171e;
      --bg-input: #0c0e13;
      --border-card: #1e2230;
      --border-input: #262b3a;
      --border-focus: #4f7cff;
      --text-primary: #edf0f5;
      --text-secondary: #7a8394;
      --text-muted: #505868;
      --accent: #4f7cff;
      --accent-hover: #3b65e0;
      --accent-glow: rgba(79, 124, 255, 0.12);
      --accent-glow-strong: rgba(79, 124, 255, 0.25);
      --dot-color: rgba(255, 255, 255, 0.035);
      --error: #ff6b6b;
      --toggle-bg: #1e2230;
      --toggle-knob: #4f7cff;
      --icon-sun: #505868;
      --icon-moon: #edf0f5;
      --shadow-card: 0 4px 48px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.3);
      --divider: #1e2230;
    }

    [data-theme="light"] {
      --bg-base: #f0f2f5;
      --bg-card: #ffffff;
      --bg-input: #f5f7fa;
      --border-card: #dfe2e8;
      --border-input: #d0d4dc;
      --border-focus: #4f7cff;
      --text-primary: #111318;
      --text-secondary: #5c6370;
      --text-muted: #9da3ae;
      --accent: #4f7cff;
      --accent-hover: #3b65e0;
      --accent-glow: rgba(79, 124, 255, 0.08);
      --accent-glow-strong: rgba(79, 124, 255, 0.18);
      --dot-color: rgba(0, 0, 0, 0.04);
      --error: #e04545;
      --toggle-bg: #dfe2e8;
      --toggle-knob: #4f7cff;
      --icon-sun: #111318;
      --icon-moon: #9da3ae;
      --shadow-card: 0 4px 48px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.06);
      --divider: #e4e7ec;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text-primary);
      transition: background-color 0.4s ease, color 0.3s ease;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    /* ── Theme toggle ── */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 40px;
      padding: 5px 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
    }

    .theme-toggle svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      transition: color 0.3s;
    }

    .toggle-track {
      width: 36px;
      height: 20px;
      background: var(--toggle-bg);
      border-radius: 20px;
      position: relative;
      transition: background 0.3s;
    }

    .toggle-knob {
      width: 14px;
      height: 14px;
      background: var(--toggle-knob);
      border-radius: 50%;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 1px 4px rgba(79, 124, 255, 0.35);
    }

    [data-theme="light"] .toggle-knob {
      transform: translateX(16px);
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 40px 36px 36px;
      box-shadow: var(--shadow-card);
      position: relative;
      transition: background 0.4s, border-color 0.3s, box-shadow 0.4s;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: var(--accent);
      border-radius: 0 0 4px 4px;
    }

    /* ── Brand ── */
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      background: var(--accent-glow);
      border: 1px solid var(--accent-glow-strong);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, border-color 0.3s;
    }

    .logo-mark svg {
      width: 24px;
      height: 24px;
      color: var(--accent);
    }

    .wordmark {
      font-family: 'Allerta Stencil', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-primary);
      transition: color 0.3s;
    }

    .tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-top: 6px;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--divider);
      margin-bottom: 28px;
      transition: background 0.3s;
    }

    /* ── Form ── */
    .form-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 22px;
      letter-spacing: 0.3px;
      transition: color 0.3s;
    }

    .field {
      margin-bottom: 18px;
      position: relative;
    }

    label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 7px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap svg {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.3s;
    }

    input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: 10px;
      padding: 12px 14px 12px 38px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.25s, background 0.3s, color 0.3s, box-shadow 0.25s;
    }

    input::placeholder {
      color: var(--text-muted);
      font-size: 13px;
    }

    input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .input-wrap:has(input:focus) svg {
      color: var(--accent);
    }

    .password-toggle {
      position: absolute;
      right: 1px;
      top: 1px;
      bottom: 1px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: auto;
      border-radius: 0 10px 10px 0;
      transition: color 0.2s;
    }

    .password-toggle:hover {
      color: var(--text-secondary);
      background: transparent;
    }

    .password-toggle svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    #error {
      color: var(--error);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 10px 14px;
      background: rgba(255, 107, 107, 0.08);
      border: 1px solid rgba(255, 107, 107, 0.15);
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
      transition: color 0.3s;
    }

    button[type="submit"] {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 13px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 6px;
      position: relative;
      overflow: hidden;
    }

    button[type="submit"]:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(79, 124, 255, 0.3);
    }

    button[type="submit"]:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: none;
    }

    button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* ── Spinner ── */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    button.loading .btn-text {
      display: none;
    }

    button.loading .spinner {
      display: inline-block;
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      margin-top: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      transition: color 0.3s;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .footer a:hover {
      opacity: 0.8;
    }

    /* ── Ambient glow ── */
    .ambient {
      position: fixed;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: -1;
      opacity: 0.6;
      transition: opacity 0.4s;
    }

    [data-theme="light"] .ambient {
      opacity: 0.3;
    }

    /* ── Responsive ── */
    @media (max-width: 440px) {
      .card {
        padding: 32px 24px 28px;
      }

      .wordmark {
        font-size: 19px;
      }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="ambient"></div>

  <!-- Theme toggle -->
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" style="color:var(--icon-sun)">
      <circle cx="12" cy="12" r="5" />
      <line x1="12" y1="1" x2="12" y2="3" />
      <line x1="12" y1="21" x2="12" y2="23" />
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
      <line x1="1" y1="12" x2="3" y2="12" />
      <line x1="21" y1="12" x2="23" y2="12" />
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
    </svg>
    <div class="toggle-track">
      <div class="toggle-knob"></div>
    </div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" style="color:var(--icon-moon)">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
  </button>

  <div class="card">
    <div class="brand">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
        </svg>
      </div>
      <div class="wordmark">Axe Intelligence</div>
      <div class="tagline">Ready to ship</div>
    </div>

    <div class="divider"></div>

    <p class="form-header">Sign in to continue</p>

    <div id="error"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <input id="username" name="username" autocomplete="username" placeholder="Enter username" required />
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input id="password" name="password" type="password" autocomplete="current-password"
            placeholder="Enter password" required style="padding-right:42px" />
          <button type="button" class="password-toggle" id="pw-toggle" aria-label="Show password">
            <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg id="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <button id="submit-btn" type="submit">
        <span class="btn-text">Sign in</span>
        <div class="spinner"></div>
      </button>
    </form>

    <div class="footer">
      Need access? <a href="#">Request an account</a>
    </div>
  </div>
  <script src="/auth/login.js"></script>
  <script>
    // ── Theme toggle ──
    const html = document.documentElement;
    const toggle = document.getElementById('theme-toggle');

    const saved = localStorage.getItem('axe-theme');
    if (saved) html.setAttribute('data-theme', saved);
    else if (window.matchMedia('(prefers-color-scheme: light)').matches) html.setAttribute('data-theme', 'light');

    toggle.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('axe-theme', next);
    });

    // ── Password visibility ──
    const pwInput = document.getElementById('password');
    const pwToggle = document.getElementById('pw-toggle');
    const eyeOpen = document.getElementById('eye-open');
    const eyeClosed = document.getElementById('eye-closed');

    pwToggle.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      eyeOpen.style.display = show ? 'none' : '';
      eyeClosed.style.display = show ? '' : 'none';
      pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  </script>
</body>

</html>
