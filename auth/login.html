<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vanmoer — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0f1115;
    color: #e8eaed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 360px;
    background: #171a21;
    border: 1px solid #262a33;
    border-radius: 14px;
    padding: 36px 32px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  p.sub {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: #8b93a1;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #8b93a1;
    margin-bottom: 6px;
    font-family: 'DM Mono', monospace;
  }
  input {
    width: 100%;
    background: #0f1115;
    border: 1px solid #2a2f3a;
    border-radius: 8px;
    padding: 11px 12px;
    color: #e8eaed;
    font-size: 14px;
    margin-bottom: 18px;
    outline: none;
  }
  input:focus { border-color: #4f7cff; }
  button {
    width: 100%;
    background: #4f7cff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button:hover:not(:disabled) { background: #3d67e8; }
  #error {
    color: #ff6b6b;
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Vanmoer</h1>
    <p class="sub">sign in to continue</p>
    <div id="error"></div>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="submit-btn" type="submit">Sign in</button>
    </form>
  </div>
  <script src="/auth/login.js"></script>
</body>
</html>
