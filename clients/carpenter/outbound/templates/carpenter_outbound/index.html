<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/auth/client.js"></script>
<script>VanmoerAuth.guardCurrentTaskPage();</script>
<title>Vanmoer — Carpenter Outbound</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #d1d5db;
    --border-active: #3b6cce;
    --text: #1a1a2e;
    --text-muted: #6b7280;
    --accent: #2b5ea7;
    --accent-hover: #1e4a8a;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --amber: #d97706;
    --amber-bg: #fffbeb;
    --radius: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .header {
    background: var(--accent);
    color: white;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
  .header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  .header button {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }

  .container { max-width: 720px; margin: 0 auto; padding: 28px 24px 80px; }

  .upload-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .upload-section h2 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .upload-section .desc { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

  .drop-zone {
    border: 2px dashed var(--border); border-radius: var(--radius); padding: 36px 16px;
    text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; position: relative;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--border-active); background: #f0f5ff; }
  .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop-zone .icon { font-size: 32px; margin-bottom: 8px; display: block; }
  .drop-zone .label { font-size: 13px; color: var(--text-muted); }
  .drop-zone .label strong { color: var(--accent); }

  .preview { margin-top: 14px; }
  .preview img { max-width: 100%; max-height: 320px; border-radius: 6px; border: 1px solid var(--border); display: block; margin: 0 auto; }

  .file-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .file-item {
    display: flex; align-items: center; justify-content: space-between; font-size: 13px;
    padding: 6px 10px; background: #f9fafb; border-radius: 6px; border: 1px solid #e5e7eb;
  }
  .file-item .name { display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .file-item .size { color: var(--text-muted); font-size: 11px; margin-left: 8px; white-space: nowrap; }
  .file-item .remove { background: none; border: none; color: var(--red); cursor: pointer; font-size: 16px; padding: 0 4px; line-height: 1; flex-shrink: 0; }

  .actions { margin-top: 24px; text-align: center; }
  .btn-generate {
    background: var(--accent); color: white; border: none; padding: 12px 40px; font-size: 15px;
    font-weight: 600; border-radius: var(--radius); cursor: pointer; transition: background 0.2s;
  }
  .btn-generate:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-panel { margin-top: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: none; }
  .status-panel.visible { display: block; }

  .spinner {
    display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }

  .summary-stat {
    display: inline-block; background: #f0f5ff; border: 1px solid #d0ddf5; padding: 6px 14px;
    border-radius: 6px; font-size: 13px; margin: 4px 4px 4px 0;
  }
  .summary-stat strong { color: var(--accent); }

  table.result-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
  table.result-table th, table.result-table td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
  table.result-table th { background: #f0f5ff; font-weight: 600; }

  .btn-download {
    display: inline-block; margin-top: 14px; background: var(--green); color: white;
    text-decoration: none; padding: 10px 28px; font-size: 14px; font-weight: 600;
    border-radius: var(--radius); transition: background 0.2s; border: none; cursor: pointer;
  }
  .btn-download:hover { background: #138a3e; }

  .error-msg { background: var(--red-bg); color: var(--red); padding: 12px 16px; border-radius: var(--radius); font-size: 13px; border: 1px solid #fecaca; }

  @media (max-width: 640px) {
    .container { padding: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>{{ label }}</h1>
    <p>Upload the order table screenshot → Generate Reference / Doc Type Excel</p>
  </div>
  <button id="logout-btn">Log out</button>
</div>

<div class="container">

  <div class="upload-section">
    <h2>Order Table Screenshot</h2>
    <p class="desc">PNG or JPG image of the order grid</p>
    <div class="drop-zone" id="dz-image" data-input="file-image">
      <span class="icon">🖼️</span>
      <span class="label">Drop image or <strong>browse</strong></span>
      <input type="file" id="file-image" accept=".png,.jpg,.jpeg">
    </div>
    <div class="file-list" id="list-image"></div>
    <div class="preview" id="preview"></div>
  </div>

  <div class="actions">
    <button class="btn-generate" id="btn-generate" disabled>Generate Output</button>
  </div>

  <div class="status-panel" id="status-panel">
    <div id="status-content"></div>
  </div>

</div>

<script>
(function() {
  const auth = VanmoerAuth.requireAuth();
  document.getElementById('logout-btn').addEventListener('click', () => VanmoerAuth.logout());

  const state = { image: null };
  const btnGenerate = document.getElementById('btn-generate');

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/(1024*1024)).toFixed(1) + ' MB';
  }

  function renderList() {
    const el = document.getElementById('list-image');
    const preview = document.getElementById('preview');
    el.innerHTML = '';
    preview.innerHTML = '';
    if (state.image) {
      const f = state.image;
      const div = document.createElement('div');
      div.className = 'file-item';
      div.innerHTML = `
        <span class="name">🖼️ ${f.name}</span>
        <span class="size">${fmtSize(f.size)}</span>
        <button class="remove" title="Remove">&times;</button>
      `;
      div.querySelector('.remove').onclick = () => {
        state.image = null;
        renderList();
      };
      el.appendChild(div);

      const img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      preview.appendChild(img);
    }
    updateBtn();
  }

  function updateBtn() {
    btnGenerate.disabled = !state.image;
  }

  function wireDropZone(dzId, inputId, onFiles) {
    const dz = document.getElementById(dzId);
    const inp = document.getElementById(inputId);

    ['dragenter','dragover'].forEach(ev => {
      dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('dragover'); });
    });
    ['dragleave','drop'].forEach(ev => {
      dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('dragover'); });
    });
    dz.addEventListener('drop', e => { onFiles(Array.from(e.dataTransfer.files)); });
    inp.addEventListener('change', () => { onFiles(Array.from(inp.files)); inp.value = ''; });
  }

  wireDropZone('dz-image', 'file-image', files => {
    const imgs = files.filter(f => /\.(png|jpe?g)$/i.test(f.name));
    if (imgs[0]) {
      state.image = imgs[0];
      renderList();
    }
  });

  let lastDownloadUrl = null;
  let lastDownloadName = 'Carpenter_Outbound_Output.xlsx';

  btnGenerate.addEventListener('click', async () => {
    const panel = document.getElementById('status-panel');
    const content = document.getElementById('status-content');
    panel.classList.add('visible');
    content.innerHTML = '<span class="spinner"></span> Reading table from image…';
    btnGenerate.disabled = true;

    const fd = new FormData();
    fd.append('table_image', state.image);

    try {
      const res = await VanmoerAuth.authFetch(window.location.pathname + 'process', { method: 'POST', body: fd });
      const data = await res.json();

      if (!res.ok || data.error) {
        content.innerHTML = `<div class="error-msg">⛔ ${data.error || 'Processing failed.'}</div>`;
        updateBtn();
        return;
      }

      let html = `<div class="status-title">Processing Complete</div>`;

      html += `<div style="margin-bottom:12px">`;
      html += `<span class="summary-stat"><strong>${data.summary.source_rows}</strong> rows read</span>`;
      html += `<span class="summary-stat"><strong>${data.summary.output_rows}</strong> output row(s)</span>`;
      html += `</div>`;

      if (data.rows && data.rows.length) {
        html += `<table class="result-table"><thead><tr><th>Reference</th><th>Doc Type</th></tr></thead><tbody>`;
        data.rows.forEach(r => {
          html += `<tr><td>${r.reference}</td><td>${r.doc_type}</td></tr>`;
        });
        html += `</tbody></table>`;
      }

      html += `<div style="margin-top:16px;text-align:center">
        <button class="btn-download" id="btn-download">⬇ Download Excel</button>
      </div>`;

      content.innerHTML = html;
      lastDownloadUrl = data.download_url;
      lastDownloadName = data.download_name || 'Carpenter_Outbound_Output.xlsx';
      document.getElementById('btn-download').addEventListener('click', async () => {
        await VanmoerAuth.downloadFile(lastDownloadUrl, lastDownloadName);
      });

    } catch (err) {
      content.innerHTML = `<div class="error-msg">⛔ Network error: ${err.message}</div>`;
    }

    updateBtn();
  });

})();
</script>
</body>
</html>
